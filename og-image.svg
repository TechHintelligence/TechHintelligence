<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D7C6B"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0D7C6B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D7C6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Accent circle top-right -->
  <circle cx="1050" cy="120" r="180" fill="#0D7C6B" opacity="0.08"/>

  <!-- Brand logo -->
  <rect x="80" y="80" width="72" height="72" rx="16" fill="url(#accentGrad)"/>
  <text x="116" y="132" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="white" text-anchor="middle">TI</text>

  <!-- Brand name -->
  <text x="172" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="white">Tech<tspan fill="#14B8A6">Intel</tspan></text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="68" font-weight="800" fill="white">Professional Websites</text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="68" font-weight="800" fill="#14B8A6">from just ₹499</text>

  <!-- Subheadline -->
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Mobile-friendly · 3-day delivery · WhatsApp integration</text>

  <!-- Offer badge -->
  <rect x="80" y="480" width="280" height="56" rx="28" fill="#DC2626" opacity="0.15"/>
  <rect x="80" y="480" width="280" height="56" rx="28" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="220" y="518" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#FCA5A5" text-anchor="middle">🔥 LIMITED TIME OFFER</text>

  <!-- Bottom tagline -->
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#64748b">Made in India 🇮🇳  ·  aiintel.netlify.app</text>

  <!-- Right side mockup -->
  <g transform="translate(820, 200)">
    <rect width="300" height="280" rx="16" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="300" height="40" rx="16" fill="#F4F2EE"/>
    <rect y="24" width="300" height="16" fill="#F4F2EE"/>
    <circle cx="20" cy="20" r="5" fill="#D6D2CA"/>
    <circle cx="40" cy="20" r="5" fill="#D6D2CA"/>
    <circle cx="60" cy="20" r="5" fill="#D6D2CA"/>
    <rect x="90" y="12" width="180" height="16" rx="8" fill="#E6E3DD"/>

    <rect x="20" y="70" width="200" height="16" rx="4" fill="#0D7C6B"/>
    <rect x="20" y="100" width="260" height="10" rx="3" fill="#E6E3DD"/>
    <rect x="20" y="118" width="220" height="10" rx="3" fill="#E6E3DD"/>
    <rect x="20" y="150" width="120" height="32" rx="16" fill="#0D7C6B"/>
    <rect x="20" y="200" width="260" height="60" rx="10" fill="#E8F3F1"/>
  </g>
</svg>